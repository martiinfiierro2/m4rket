<ion-content scrollY="false">
  <div class="contenedor">
    <div class="botones-accion">
      <div class="boton-desplegar">
        <input id="menu" type="checkbox" />
        <label for="menu"></label>
        <div class="menu">
          <ul>
            <button (click)="borrarProductosCompradosEnServidorHome();">Quitar Compras</button>
            <button (click)="BorrarListaCompraCompleta();">Borrar Lista Completa</button>
          </ul>
        </div>
      </div>
      <ion-button (click)="RecargarModelo()" id="Recargar"
        >Recargar_Modelo</ion-button>
      <div class="contador-productos" id="contador-p">
        <span class="icon"><i class="fa-solid fa-cart-shopping"></i></span>
        <p>{{ totalComprados }}/{{ totalProductos }}</p>
      </div>
    </div>

    <div class="mapa">
      <div id="canvas"></div>
    </div>
  </div>
  
  <!-- ?Chatbot icono!!! -->
  <div class="pantalla-carga" *ngIf="mostrarPantallaCarga">
    <div class="spinner"></div>
  </div>

<df-messenger
  chat-title="Fermín"
  agent-id="182b31cf-14c9-4c0b-9cd2-f35c4e65e132"
  language-code="es"
></df-messenger>
  <app-drawer></app-drawer>
</ion-content>
