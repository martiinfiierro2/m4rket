  <div class="tarjeta">
      <form (ngSubmit)="sign_up()" [formGroup]="sign_upForm">
        <h2>Registrarse</h2>
        <label for="nombre" class="formulario"><input type="text" name="nombre" id="nombre" formControlName="nombre" placeholder="Nombre"></label>
        <label for="apellido" class="formulario"><input type="text" name="apellido" id="apellido" formControlName="apellido" placeholder="Apellido"></label>
        <label for="email" class="formulario"><input type="email" name="email" id="email" formControlName="email" placeholder="Correo electrónico"></label>
        <label for="pwd" class="formulario"><input type="password" name="pwd" id="pwd" formControlName="pwd" placeholder="Contraseña"></label>
        <label for="genero" class="genero">Género
            <select name="genero" id="genero" formControlName="genero">
                <option value="hombre">Hombre</option>
                <option value="mujer">Mujer</option>
            </select>
        </label>
        <input type="submit" value="Enviar" class="botonEnviar">
      </form>  

      <div class="registro">
        <p>¿Tienes ya una cuenta?</p>
        <p><a href="/login">Inicia sesión</a></p>
    </div>
  </div>
</body>
