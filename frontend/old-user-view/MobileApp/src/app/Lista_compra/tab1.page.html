
<ion-content [fullscreen]="true">

  <ion-header collapse="condense" class="custom-header">
    <ion-toolbar class="custom-toolbar">
      <ion-title class="custom-title">Lista de la compra</ion-title>
    </ion-toolbar>
  </ion-header>
  <div class="contenedor">
    <div *ngFor="let productoDetalle of detallesProductos" class="producto-container">
      <div class="navegador-producto" (click)="cambiaPag(productoDetalle.idProducto)"> <!--[routerLink]="['/pagina-producto', producto.idProd]"-->
        <img [src]="'assets/images/' + productoDetalle.idProducto + '.jpg'" alt="Product Image" />
        <div class="product-text">
          <h3>{{productoDetalle.nombre}}</h3>
          <p> {{ productoDetalle.precio }}€</p>
        </div>
      </div>
    
      <div class="product-buttons">
        <div class="add2">
          <button (click)="decrementar(productoDetalle)">
            <ion-icon class="add-button" name="remove-circle-outline"></ion-icon>
          </button>
          <span>{{ productoDetalle.cantidad}}</span>
          <button (click)="incrementar(productoDetalle)">
            <ion-icon class="add-button" name="add-circle-outline"></ion-icon>
          </button>
          <button (click)="eliminar(productoDetalle);">
            <ion-icon class="add-button" name="trash-outline"></ion-icon>
          </button>
        </div>
      </div>
    </div>

    
  </div>

  <div class="contenedor-buscador">
    <button class="buscarProductos"[routerLink]="['/pagina-buscador']">
      Buscar productos
      <span> <ion-icon class="search-outline"></ion-icon></span>
    </button>
  </div>
  
  
  <!--<app-explore-container name="Lista de la compra"></app-explore-container>-->
</ion-content>
