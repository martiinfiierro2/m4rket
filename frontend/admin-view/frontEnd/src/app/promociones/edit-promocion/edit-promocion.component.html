<div id="editPromocion">
    <h2>Editar promoción</h2>
    <form (ngSubmit)="editarPromo()" *ngIf="promocionEditar" [formGroup]="promoForm">
        <label for="nombre">Nombre<input type="text" name="nombre" id="nombre" formControlName="nombre" [(ngModel)]="promocionEditar.nombre"></label>
        <label for="fecha_ini">Fecha inicio<input type="date" name="fecha_ini" id="fecha_fin" formControlName="fecha_ini" [(ngModel)]="promocionEditar.fecha_ini"></label>
        <label for="fecha_fin">Fecha fin<input type="date" name="fecha_fin" id="fecha_fin" formControlName="fecha_fin" [(ngModel)]="promocionEditar.fecha_fin"></label>
        <label for="tipoPromo">Tipo promoción
            <select name="tipoPromo" id="tipoPromo" formControlName="id_tipoPromo" [(ngModel)]="promocionEditar.id_tipoPromo">
                <option *ngFor="let tipoPromo of tipoPromos" value="{{tipoPromo.id}}">{{tipoPromo.nombre}}</option>
            </select>
        </label>
        <div id="buttons">
            <input type="submit" value="Actualizar" class="btnPrimario">
            <input type="button" value="Cancelar" (click)="atras()" class="btnSecundario">
        </div>
    </form>
</div>
