<body>
    <div id="sidebar_menu" [ngClass]="{'small-sidebar': isSidebarSmall, 'expanded': !isSidebarSmall}">
        <div id="head">
            <img src="../../../assets/img/logoBlancoGrande.png" alt="Logo de la aplicación">
            <h2>M4RKET</h2>
        </div>
        <div id="menuContent">
            <div id="topMenu">
                <div class="linea" id="lineaProductos">
                    <span class="icono"><a href="/productos" class="fa-solid fa-file-lines"></a></span>
                    <span><a href="/productos">Stock</a></span>
                </div>
                <div class="linea" id="lineaPromociones">
                    <span class="icono"><a href="/promociones" class="fa-solid fa-percent"></a></span>
                    <span><a href="/promociones">Promociones</a></span>
                </div>
                <div class="linea" id="lineaUbicaciones">
                    <span class="icono"><a href="/ubicaciones" class="fa-solid fa-location-dot"></a></span>
                    <span><a href="/ubicaciones">Ubicaciones</a></span>
                </div>
                <div class="linea" id="lineaEstadisticas">
                    <span class="icono"><a href="/estadisticas" class="fa-solid fa-chart-simple"></a></span>
                    <span><a href="/estadisticas">Estadísticas</a></span>
                </div>
                <div  [ngClass]="clase"  class="linea" id="lineaCuentas" *ngIf="superAdmin">      
                    <span class="icono"><a href="/usuarios" class="icono fa-solid fa-user-gear"></a></span>
                    <span><a href="/usuarios">Cuentas</a></span>
                </div>
                <div *ngIf="!isSidebarSmall" class="linea minimizar" (click)="toggleSidebarSize()">
                    <div class="icono" ><i class="fa-solid fa-window-minimize"></i></div>
                    <span>Minimizar</span>
                </div>
                <div  *ngIf="isSidebarSmall" class="linea minimizar" (click)="toggleSidebarSize()">
                    <div class="icono" ><i class="fa-regular fa-window-maximize"></i></div>
                </div>
    
                <div *ngIf="!isNightMode"class="linea minimizar" (click)="toggleNightMode()">
                    <div class="icono" ><i class="fa-solid fa-moon"></i></div>
                    <span>Modo noche</span>
                </div>
                <div  *ngIf="isNightMode" class="linea minimizar" (click)="toggleDayMode()">
                    <div class="icono"><i class="fa-regular fa-sun"></i></div>
                    <span>Modo día</span>
                </div>
                
                
            </div>
            <div id="bottomMenu">
                <div class="linea">
                    <span class="icono fa-solid fa-user"></span>
                    <span id="nombreUsuario" class="enlace"></span>
                </div>
                <div class="linea">
                    <span class="icono fa-solid fa-right-from-bracket"></span>
                    <span (click)="logOut()" class="enlace">Cerrar sesión</span>
                </div>
            </div>
           
        </div>
    </div>
    

</body>
