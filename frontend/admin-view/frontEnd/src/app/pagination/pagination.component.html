<div class="row">
    <div id="textoPagiancion" *ngIf="texto">
        <div role="status" aria-live="polite" *ngIf="totalRegistros > 0 ">
            Mostrando {{registroActual}} - {{registroHasta}} de {{totalRegistros}}
        </div>
        <div role="status" aria-live="polite" *ngIf="totalRegistros <= 0">
            No hay registros
        </div>
    </div>
    <nav aria-label="Page navigation example ">
        <ul class="row" id="listadoPaginas">
            <li class="page-item" [ngClass]="{'disabled' : paginaActual<=1}" (click)="cambiaPagina(1)">
                <span class="page-link"><i class="icon-angle-double-left"></i></span>
            </li>
            <li class="page-item" [ngClass]="{'disabled' : paginaActual<=1}" (click)="cambiaPagina(paginaActual - 1)">
                <span class="page-link"><i class="icon-angle-left"></i></span>
            </li>
            
            <!-- 3 4 5 6 7 -->
            <li class="page-item" [ngClass]="{'active': numeropagina===paginaActual}" *ngFor="let numeropagina of listaPaginas" (click)="cambiaPagina(numeropagina)">
                <span class="page-link">
                        {{numeropagina}}
                    </span>
            </li>

            <li class="page-item" [ngClass]="{'disabled' : paginaActual>=ultimaPagina}" (click)="cambiaPagina(paginaActual + 1)">
                <span class="page-link"><i class="icon-angle-right"></i></span>
            </li>
            <li class="page-item" [ngClass]="{'disabled' : paginaActual>=ultimaPagina}" (click)="cambiaPagina(ultimaPagina)">
                <span class="page-link"><i class="icon-angle-double-right"></i></span>
            </li>
        </ul>
    </nav>
</div>
