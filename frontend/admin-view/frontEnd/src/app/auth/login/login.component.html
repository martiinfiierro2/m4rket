

<body>
    <div class="contenedor">
        <h1>¡Hola!</h1>
        <h2>Bienvenido de vuelta a M4RKET.</h2>

        <hr>

        
        <form (ngSubmit)="login()" [formGroup]="loginForm">
            <label for=" email">
                Correo eléctrónico
                <input type="email" name="email" formControlName="email" id="email" class="box"> 
            </label>
            <label for="pwd">
                Contraseña
                <input type="password" name="pwd" formControlName="pwd" id="pwd" class="box">
            </label>
            <label for="recordarme">Recordarme <input type="checkbox" formControlName="check" name="recordarme" id="recordarme"></label>
            <div id="avisos">
                <p class="text-danger" *ngIf="!campoValido('email')">El usuario es obligatorio y debe ser un email</p>
                <p class="text-danger" *ngIf="!campoValido('pwd')">El campo contraseña es obligatorio</p>
            </div>
            <button type="submit" class="btnPrimario" [disabled]="esperando" ><i id="iconoCarga" class="fas fa-spinner fa-spin" *ngIf="esperando" ></i> Inicia sesión</button>
        </form>
    </div>
    <div class="fondoFoto"></div>
    
</body>
