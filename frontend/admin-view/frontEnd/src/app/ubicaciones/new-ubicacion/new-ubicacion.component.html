<body>
    <div class="add">
        <h2>Añadir ubicación</h2>
        <form (ngSubmit)="anyadirUbi()" [formGroup]="ubiForm">
            <div class="divCampo">
                <label for="referencia">Referencia</label>
                    <input type="text" name="referencia" id="referencia" formControlName="referencia">
            </div>
           <div class="divCampo">
                <label for="posicion">Posición</label>
                <input type="number" name="posicion" id="posicion" formControlName="posicion">
           </div>
            <div id="botones">
                <input type="submit" value="Añadir" class="btnPrimario">
                <input type="button" value="Cancelar" class="btnSecundario" (click)="atras()">
            </div>
        </form>
    </div>
</body>
