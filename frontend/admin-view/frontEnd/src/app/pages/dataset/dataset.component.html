<header>
    <img src="../../../assets/img/logoM4RKET.png" alt="logo de M4RKET">
    <h1>M4RKET - Dataset</h1>
</header>
<main>
    <div id="headerMain">
        <div>
            <input type="text" placeholder="Búsqueda">
            <input type="submit" value="Buscar">
        </div>
        <div>
            <select name="descarga" (change)="formatoDescarga($event)">
                <option value="default">Descargar</option>
                <option value="pdf">PDF</option>
                <option value="xlsx">XLSX</option>
                <option value="csv">CSV</option>
            </select>
        </div>
    </div>
    <div id="contentMain">
        <article *ngFor="let producto of productos" (click)="redirigirProducto(producto.id)">
            <img id="imagenProducto" [src]="this.urlFotoProducto + producto.foto" alt="Imagen del producto">
            <p>{{producto.nombre}}</p>
            <p>{{producto.marca}}</p>
        </article>
    </div>
    <!-- Paginación -->
    <div class="d-flex justify-content-center">
        <app-pagination (cambiarPagina)="cambiarPagina( $event )" [texto]="true" [totalRegistros]="totalregistros" [registroActual]="posicionactual+1" [registrosPorPagina]="registrosporpagina">
        </app-pagination>
    </div>

</main>



<script type="application/ld+json">
    {
        "@context": "http://schema.org",
        "@type": "dataset",
        "url": "https://m4rket.ovh/dataset",
        "name": "Productos disponibles en el mercado",
        "description": "Tabla/listado de los productos disponibles en el mercado con sus datos nutricionales",
        "keywords": "productos, valores nutricionales, nutricion, precio, precio productos",
        "license": "http://m4rket.ovh/corp",
        "creator": {
            "@type": "Organization",
            "name": "4AM"
        },
        "dateCreated": "2023-01-10",
        "dateModified": "",
    }
</script>
