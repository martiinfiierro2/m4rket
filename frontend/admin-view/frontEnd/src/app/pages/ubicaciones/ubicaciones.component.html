<div id="header">
    <div id="divSearch">
        <input type="text" name="search" id="search" class="barraBusqueda" placeholder="Búsqueda">
    </div>
    <div id="botonesHeader">
        <button (click)="newUbicacion()" class="btnPrimario">Añadir ubicación</button>
    </div>
</div>

<div id="listadoUbicaciones">
    <table class="table">
        <thead>
            <tr>
                <th>Referencia</th>
                <th>Posición</th>
                <th>Acción</th>
            </tr>
        </thead>
        <tbody>
            <tr *ngFor="let ubicacion of ubicaciones">
                <td> {{ ubicacion.referencia }}</td>
                <td> {{ ubicacion.posicion }}</td>
                <td>
                    <button (click)="ejecutarAccion(ubicacion.id)" class="btnIcon" id="btnBorrar"><span class="iconoAccion fa-solid fa-trash"></span></button>
                    <button (click)="editUbi(ubicacion.id)" class="btnIcon" id="btnEdit"><span class="iconoAccion fa-solid fa-pen"></span></button>
                </td>
            </tr>
        </tbody>
    </table>

    <!-- Paginación -->
    <div class="d-flex justify-content-center">
        <app-pagination (cambiarPagina)="cambiarPagina( $event )" [texto]="true" [totalRegistros]="totalregistros" [registroActual]="posicionactual+1" [registrosPorPagina]="registrosporpagina">
        </app-pagination>
    </div>

</div>




<!-- Modal -->
<div class="modal" id="mensajeModal">
    <div class="modal-content">
      <span class="close" (click)="cerrarModal()">&times;</span>
      <div class="center-text">
        <p>¿Realmente deseas borrar este producto?</p>
        <button (click)="confirmarBorrado()">Confirmar</button>
      </div>
    </div>
</div>
