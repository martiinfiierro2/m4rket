<div id="header">
    <div id="idSearch">
        <form>
            <input type="text" name="search" id="search" placeholder="Búsqueda">
            <input type="submit" value="Buscar" class="btnPrimario">
        </form>
    </div>
    <div id="botonesHeader">
        <button (click)="newUbicacion()" class="btnPrimario">Añadir ubicación</button>
    </div>
</div>

<div id="listadoUbicaciones">
    <table class="table">
        <thead>
            <tr>
                <th>Referencia</th>
                <th>Posición</th>
                <th>Acción</th>
            </tr>
        </thead>
        <tbody>
            <tr *ngFor="let ubicacion of ubicaciones">
                <td> {{ ubicacion.referencia }}</td>
                <td> {{ ubicacion.posicion }}</td>
                <td>
                    <button (click)="ejecutarAccion(ubicacion.id)" class="btnIcon" id="btnBorrar"><mat-icon class="iconoAccion">delete</mat-icon></button>
                    <button (click)="editUbi(ubicacion.id)" class="btnIcon" id="btnEdit"><mat-icon class="iconoAccion">edit</mat-icon></button>
                </td>
            </tr>
        </tbody>
    </table>
</div>


<!-- Modal -->
<div class="modal" id="mensajeModal">
    <div class="modal-content">
      <span class="close" (click)="cerrarModal()">&times;</span>
      <div class="center-text">
        <p>¿Realmente deseas borrar este producto?</p>
        <button (click)="confirmarBorrado()">Confirmar</button>
      </div>
    </div>
</div>
