<div id="header">
    <div id="divSearch">
        <input type="text" name="search" id="search" placeholder="Búsqueda" [(ngModel)]="valueBusquedaInput" class="barraBusqueda">
    </div>
    <div id="botonesHeader">
        <button (click)="creacionUsuario = true" class="btnPrimario">Registar admin</button>
        <div id="desplegableFiltros" class="btnSecundario">
            <span (click)="desplegarFiltros()">Filtros búsqueda</span>
            <div id="contenido-desplegableFiltros" *ngIf="mostrarDesplegableFiltros">
                <label *ngFor="let opcion of opciones">
                    <input type="checkbox" [value]="opcion.value" (change)="seleccionarOpcion(opcion)">
                    {{ opcion.label }}
                </label>
            </div>
        </div>
    </div>
   
</div>

<div id="formularioRegistro" *ngIf="creacionUsuario">
    <form [formGroup]="usuarioForm" (ngSubmit)="crearUsuario()">
        <input type="text" id="nombre" placeholder="Nombre*"  formControlName="nombre">
        <input type="text" id="apellido" placeholder="Apellidos*" formControlName="apellido">
        <input type="email" id="email" placeholder="Email*" formControlName="email">
        <input type="password" id="pwd" placeholder="Contraseña*" formControlName="pwd">
        <select name="sexo" id="sexo" formControlName="genero">
            <option value="hombre">Hombre</option>
            <option value="mujer">Mujer</option>
        </select>
        <div id="botonesForm">
            <button type="submit" class="btnIcon" id="btnCheck"><span class="fa-solid fa-check"></span></button>
            <button class="btnIcon" id="btnCancel" (click)="cerrarFormulario()"><span class="fa-solid fa-x"></span></button>
        </div>
    </form>
</div>

<div id="listadoUsuarios" *ngIf="usuarios">
    <table class="table">
        <thead>
            <tr>
                <th>Nombre</th>
                <th>Apellidos</th>
                <th>Email</th>
                <th>Rol</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody>
            <tr *ngFor="let usuario of usuarios" >
                <td>{{ usuario.nombre }}</td>
                <td>{{ usuario.apellido }}</td>
                <td>{{ usuario.email }}</td>   
                <td>{{ usuario.rol }}</td>
                <td>
                    <button (click)="borrarUsu(usuario.uid)" class="btnIcon" id="btnBorrar"><span class="fa-solid fa-trash"></span></button>
                </td>
            </tr>
        </tbody>
    </table>

    <!-- Paginación -->
    <div class="d-flex justify-content-center">
        <app-pagination (cambiarPagina)="cambiarPagina( $event )" [texto]="true" [totalRegistros]="totalregistros" [registroActual]="posicionactual+1" [registrosPorPagina]="registrosporpagina">
        </app-pagination>
    </div>  

</div>
