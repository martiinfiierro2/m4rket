<body>
    <div class="filtro">
        <label for="fechaInicio">Fecha de inicio:</label>
        <input type="date" id="fechaInicio" [(ngModel)]="fechaInicio">

        <label for="fechaFin">Fecha de fin:</label>
        <input type="date" id="fechaFin" [(ngModel)]="fechaFin">
        <button (click)="filtrar()">Filtrar</button>
    </div>

    <div class="div1" (click)="mostrarGrafico('masEliminado')" id="masEliminados" style="width: 33%; height: 33%;"></div>
    <div class="div2" (click)="mostrarGrafico('masAnadido')" id="masAnadidos" style="width: 33%; height: 33%;"></div>
    <div class="div3">
        <h5>QR usados en la última semana</h5>
            <article>
            <p class="valor">{{numQR[0]}}
                <sup><p class="datoQRP" *ngIf="numQR[2] >= 0"><i class="fa-solid fa-arrow-trend-up"></i>{{numQR[2]}}%</p></sup>
                <sup><p class="datoQRN" *ngIf="numQR[2] < 0"><i class="fa-solid fa-arrow-trend-down"></i>{{numQR[2]}}%</p></sup>
            </p>
        </article>
    </div>
</body>
