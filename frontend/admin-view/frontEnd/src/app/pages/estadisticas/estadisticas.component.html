<body>
    <div id="global">
        <div class="caja2">
            <h5>Productos más buscados</h5>
            <table>
                <tr *ngFor="let contador of contadores">
                    <td> {{ contador.totalCount }} </td><td> {{ contador.nombre }} </td>
                </tr>
            </table>
        </div>
        <div class="caja2">
            <h5>QR usados en la última semana</h5>
            <p>Esta semana {{numQR[0]}} </p>
            <p>Semana pasada {{numQR[1]}} </p>
            <p>{{numQR[2]}}%</p>
        </div>
    </div>
</body>
