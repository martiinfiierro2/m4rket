<body>
<div class="filtro">
   <!--
    <label class="radio">
      
        <input type="radio" name="radio" checked="">
        <span class="name">Hoy</span>
      </label>
      -->
      <label class="radio">
        <input type="radio" name="radio" checked="" (click)="obtenerFechasRangoSeleccionado('7d')">
        <span class="name">Últimos 7 días</span>
      </label>
      <label class="radio">
        <input type="radio" name="radio" (click)="obtenerFechasRangoSeleccionado('1m')">
        <span class="name">Últimos 30 días</span>
      </label>
    <label class="radio">
        <input type="radio" name="radio" (click)="obtenerFechasRangoSeleccionado('12m')">
        <span class="name">2024</span>
      </label>    
</div>


<div class="contenedor_stats">
  <div class="parent">
    <div class="div1" id="divs_stats">
      <p class="stat_title">Productos listados</p>
      <p>{{totalAnadidos}}</p>
      <div id="graf-list" style="width: 50%; height: 50%;"></div>
    </div>
    <div class="div2" id="divs_stats"> 
      <p class="stat_title" id="masAnadidos">Total comprados</p>
    </div>
    <div class="div3" id="divs_stats"> 
      <p class="stat_title">Total eliminados</p>
      <p>{{totalEliminados}}</p>
    </div>
    <div class="div4" id="divs_stats"> 
      <p class="stat_title">Porcentaje añadidos/comprados</p>
    </div>
    <div class="div5" id="divs_stats"> 
      <p class="stat_title">Usuarios activos</p>
      <div id="grafico" style="width: 95%; height: 90%;"></div>
    </div>
    <div class="div6" id="divs_stats"> 
      <p class="stat_title" >Productos más buscados</p>
      <div *ngFor="let producto of anadidos; let i = index">
        <div class="content_prods" >
          <div class="prod" *ngIf="i < 5">
            <p>{{producto.name}}</p>
            <p>{{producto.value}} veces comprado</p>
          </div>
        </div>
      </div>
      
    </div>
    <div class="div7" id="divs_stats"> 
      <p class="stat_title">Usuarios únicos</p>
    </div>
    <div class="div8" id="divs_stats"> 
      <p class="stat_title">Tiempo de uso medio por usuario</p>
    </div>
    <div class="div9" id="divs_stats"> 
      <p class="stat_title">Localizaciones totales</p>
    </div>
    </div>

</div>
