<body>
    <div id="global">
        <div class="caja2">
            <h5>Productos más añadidos</h5>
            <table>
                <tr *ngFor="let anadido of anadidos">
                    <td> {{ anadido.totalCount }} </td><td> {{ anadido.nombre }} </td>
                </tr>
            </table>
        </div>
        <div class="caja2">
            <h5>Productos más eliminados</h5>
            <table>
                <tr *ngFor="let eliminado of eliminados">
                    <td> {{ eliminado.totalCount }} </td><td> {{ eliminado.nombre }} </td>
                </tr>
            </table>
        </div>
        <div class="caja2">
            <h5>QR usados en la última semana</h5>
            <p>Esta semana {{numQR[0]}} </p>
            <p>Semana pasada {{numQR[1]}} </p>
            <p>{{numQR[2]}}%</p>
        </div>
    </div>
</body>
