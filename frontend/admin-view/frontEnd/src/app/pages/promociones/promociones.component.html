<div id="header">
    <div id="divSearch">
        <input type="text" name="search" id="search" class="barraBusqueda" placeholder="Buscar promoción">
    </div>
</div>
<div class="superior_tabla">
  <div id="botonesHeader">
    <!--
    <button (click)="irNuevaPromo()" class="btnPrimario">Añadir promoción</button>-->
    <button *ngIf="opcionMostrar == 'promo'" (click)="mostrarModal()" class="btnPrimario"><i class="fa-solid fa-plus"></i>Añadir promoción</button>
    <button *ngIf="opcionMostrar == 'tipo'" (click)="irNuevoTipoPromo()" class="btnSecundario"><i class="fa-solid fa-plus"></i>Añadir tipo promoción</button>
    </div>
  
  <div class="filtro">
    <label class="radio">
      <input type="radio" name="radio" checked="" (click)="cambioOpcion('promo')">
      <span class="name">Promociones</span>
    </label>
    <label class="radio">
      <input type="radio" name="radio" (click)="cambioOpcion('tipo')">
      <span class="name">Tipos de promoción</span>
    </label>  
    </div>
    
  </div>
  

<div id="listadoPromociones" *ngIf="promociones">
    <div *ngIf="opcionMostrar == 'tipo'">
      <table class="table">
        <thead>
          <tr>
            <th>Nombre</th>
            <th>Descripción</th>
            <th>Modificador</th>
            <th>Acción</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let tipos of tiposPromocion">
            <td>
              <ng-container *ngIf="!tipos.isEdit; else editNombre">
                {{ tipos.nombre }}
              </ng-container>
              <ng-template #editNombre>
                <input [(ngModel)]="tipos.nombre" />
              </ng-template>
            </td>
            <td>
                <ng-container *ngIf="!tipos.isEdit; else editDescripcion">
                  {{ tipos.descripcion }}
                </ng-container>
                <ng-template #editDescripcion>
                  <input [(ngModel)]="tipos.descripcion" />
                </ng-template>
              </td>
            <td>
              <ng-container *ngIf="!tipos.isEdit; else editModificador">
                {{ tipos.modificador }}
              </ng-container>
              <ng-template #editModificador>
                <input [(ngModel)]="tipos.modificador" />            
              </ng-template>
            </td>
            <td>
              <ng-container *ngIf="!tipos.isEdit; else editActions">
                <button (click)="editPromo(tipos)"class="btnIcon" id="btnEdit">
                  <span class="iconoAccion fa-solid fa-pen"></span>
                </button>
                <button (click)="borrarTipo(tipos.id)" class="btnIcon" id="btnBorrar">
                  <span class="iconoAccion fa-solid fa-trash"></span>
                </button>
              </ng-container>
              <ng-template #editActions>
                <button (click)="savePromoTipo(tipos)" class="btnIcon" id="btnSave">
                  <span class="iconoAccion fa-solid fa-check"></span>
                </button>
                <button (click)="cancelarEditTipo(tipos)" class="btnIcon" id="btnCancel">
                  <span class="iconoAccion fa-solid fa-times"></span>
                </button>
              </ng-template>
            </td>
          </tr>
        </tbody>
      </table>

    </div>
    
    <div *ngIf="opcionMostrar == 'promo'">
  <table class="table">
        <thead>
          <tr>
            <th>Nombre</th>
            <th>Tipo</th>
            <th>Fecha inicio</th>
            <th>Fecha fin</th>
            <th>Acción</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let promocion of promociones">
            <td>
              <ng-container *ngIf="!promocion.isEdit; else editNombre">
                {{ promocion.nombre }}
              </ng-container>
              <ng-template #editNombre>
                <input [(ngModel)]="promocion.nombre" />
              </ng-template>
            </td>
            <td>
                <ng-container *ngIf="!promocion.isEdit; else editTipo">
                  {{ promocion.tipopromo.nombre }}
                </ng-container>
                <ng-template #editTipo>
                  <select [(ngModel)]="promocion.id_tipoPromo">
                    <option *ngFor="let tipoPromo of tipoPromos" [value]="tipoPromo.id">{{ tipoPromo.nombre }}</option>
                  </select>
                </ng-template>
              </td>
            <td>
              <ng-container *ngIf="!promocion.isEdit; else editFechaIni">
                {{ promocion.fecha_ini }}
              </ng-container>
              <ng-template #editFechaIni>
                <input type="date" [(ngModel)]="promocion.fecha_ini" />
              </ng-template>
            </td>
            <td>
              <ng-container *ngIf="!promocion.isEdit; else editFechaFin">
                {{ promocion.fecha_fin }}
              </ng-container>
              <ng-template #editFechaFin>
                <input type="date" [(ngModel)]="promocion.fecha_fin" />
              </ng-template>
            </td>
            <td>
              <ng-container *ngIf="!promocion.isEdit; else editActions">
                <button (click)="editPromo(promocion)" class="btnIcon" id="btnEdit">
                  <span class="iconoAccion fa-solid fa-pen"></span>
                </button>
                <button (click)="borrarPromo(promocion.id)" class="btnIcon" id="btnBorrar">
                  <span class="iconoAccion fa-solid fa-trash"></span>
                </button>
              </ng-container>
              <ng-template #editActions>
                <button (click)="savePromo(promocion)" class="btnIcon" id="btnSave">
                  <span class="iconoAccion fa-solid fa-check"></span>
                </button>
                <button (click)="cancelarEdit(promocion)" class="btnIcon" id="btnCancel">
                  <span class="iconoAccion fa-solid fa-times"></span>
                </button>
              </ng-template>
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <!-- Paginación -->
    <div class="d-flex justify-content-center">
        <app-pagination (cambiarPagina)="cambiarPagina( $event )" [texto]="true" [totalRegistros]="totalregistros" [registroActual]="posicionactual+1" [registrosPorPagina]="registrosporpagina">
        </app-pagination>
    </div>
    
   
</div>
<div class="anadir_promo"  [style]="visualizacionModalPromo"> 
    <app-new-promocion></app-new-promocion>
</div>
<div class="tipo_promo"  [style]="visualizacionModalTipoPromo"> 
    <app-new-tipo-promocion></app-new-tipo-promocion>
</div>
